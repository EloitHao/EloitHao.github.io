<!DOCTYPE html>
<html lang="zh-CN">
   <head>
      {% include head.html %}
      <!-- main style sheet -->
      <link rel="stylesheet" href="{{site.url}}{{site.baseurl}}/assets/css/home.css">
   </head>
   <body>
      <div id="particles-js">
         <div class="header">
            <h1>
               <span class="site-title">{{site.title}}</span>
               <span class="site-description">{{site.description}}</span>
            </h1>
            <div class="header-links">
               <a class="link" href="/blog">文章</a>
               <a class="link" href="/about" >关于</a>
            </div>
         </div>
         <a class="down" href="#about" data-scroll aria-label="向下滚动">
            <svg class="icon" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="z-index: 2;"><polyline points="6 9 12 15 18 9"></polyline></svg>
         </a>
      </div>
      <section id="about">
         <div class="lower">
            {{ content }}
         </div >
      </section>
      <script src= "https://unpkg.com/sweet-scroll/sweet-scroll.min.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/particles.js@2/particles.js"></script>
      <script src="{{site.url}}{{site.baseurl}}/assets/js/particles_conf.js"></script>
      <script>
         /* sweetScroll load */
         	document.addEventListener('DOMContentLoaded', () => {
         		const scroller = new SweetScroll({/* some options */});
         	}, false);
      </script>
   </body>
   {% include footer.html analytics=false %}
</html>
