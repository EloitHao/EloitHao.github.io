---
layout: displayindex
title: 文章索引
---
<h1>{{ page.title }}</h1>
	<dl class="posts">
	 {% for post in site.posts %}
		<dt>
			<span class="post-date">{{ post.date | date: "%Y-%m-%d" }}</span> <a class="post-link" href="{{ post.url }}">{{ post.title }}</a>&nbsp;{% include status-indicator.html status=post.status%}
    </dt>
    {% if post.description %}
 <dd style="text-align: justify">{{ post.description  | markdownify }}
    </dd>
		 {% endif %}
		{% endfor %}
	</dl>
