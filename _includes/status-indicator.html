{% assign status = include.status %}
{% case status%}
{% when "Completed" %}
<code style="background-color: #42B4B9; color: white;"><b>已完成</b></code>
{% when 'Writing' %}
<code style="background-color: #139223; color: white;"><b>写作中</b></code>
{% when  'Paused' %}
<code style="background-color: #B98342; color: white;"><b>已暂停</b></code>
{% when  'Archived' %}
<code style="background-color: #345E5E;color: white;"><b>已归档</b></code>
{% else %}	
<code><b>{{ post.status}}</b></code> 
{% endcase %}
